services:
  - type: web
    name: linkedin-enrichment
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: LOG_LEVEL
        value: INFO
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1
